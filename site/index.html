    <main id="main" class="content">
      <h1 class="sr-only">@apricot-cake</h1>
      <section aria-label="アプリ一覧">
        <ul class="card-list">
          <li>
            <article class="card">
              <button class="card-play" type="button" aria-controls="sift-video" aria-haspopup="dialog">
                <span class="card-image"><img src="https://i.ytimg.com/vi/KqO-4fv2Qsw/maxresdefault.jpg" alt="Sift の紹介動画を再生"></span>
                <span class="card-title">【作ってみた】いいね数でフィルターするやつ</span>
              </button>
            </article>
          </li>
          <li>
            <article class="card card--placeholder" aria-label="ダミーカード">
              <div class="card-placeholder" aria-hidden="true">Coming soon</div>
              <span class="card-title">ダミーカード</span>
            </article>
          </li>
        </ul>
      </section>
    </main>
    <dialog class="video-dialog" id="sift-video" aria-label="Sift の紹介動画">
      <div class="video-dialog__player"></div>
    </dialog>
    <script>
      const playButton = document.querySelector('.card-play');
      const dialog = document.querySelector('#sift-video');
      const playerContainer = document.querySelector('.video-dialog__player');

      playButton.addEventListener('click', () => {
        if (!playerContainer.querySelector('iframe')) {
          const player = document.createElement('iframe');
          player.src = 'https://www.youtube-nocookie.com/embed/KqO-4fv2Qsw?autoplay=0&cc_load_policy=0';
          player.title = 'Sift の紹介動画';
          player.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          player.allowFullscreen = true;
          player.referrerPolicy = 'strict-origin-when-cross-origin';
          playerContainer.append(player);
        }

        dialog.showModal();
      });

      dialog.addEventListener('close', () => {
        playerContainer.replaceChildren();
        playButton.blur();
      });

      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) dialog.close();
      });
    </script>
